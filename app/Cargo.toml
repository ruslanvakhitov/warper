[package]
authors = ["Warp Team <dev@warp.dev>"]
default-run = "warp-oss"
description = "A local-first terminal"
edition = "2021"
autobins = false
name = "warp"
version = "0.5.1"
publish.workspace = true
license.workspace = true

[lib]
name = "warp"
path = "src/lib.rs"

[[bin]]
name = "warp-oss"
path = "src/bin/oss.rs"
test = false

[[bin]]
name = "generate_settings_schema"
path = "src/bin/generate_settings_schema.rs"
test = false

[dependencies]
addr = "0.15.6"
